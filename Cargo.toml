[workspace]
resolver = "2"
members = [
    "vnet-proto",
    "vnet-core",
    "vnet",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "LGPL-3.0"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-trait = "0.1"

# serialization
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# crypto
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"

# network
tun = { version = "0.7", features = ["async"] }
bytes = "1"
dashmap = "6"
parking_lot = "0.12"

# cli
clap = { version = "4", features = ["derive"] }

# web
axum = "0.8"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# misc
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
strip = true
