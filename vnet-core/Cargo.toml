[package]
name = "vnet-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "vnet core library: TUN, tunnel, crypto, routing, NAT traversal"

[dependencies]
vnet-proto = { path = "../vnet-proto" }

tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true

prost.workspace = true
serde.workspace = true
toml.workspace = true

aes-gcm.workspace = true
x25519-dalek.workspace = true
rand.workspace = true
sha2.workspace = true
hkdf.workspace = true

tun.workspace = true
bytes.workspace = true
dashmap.workspace = true
parking_lot.workspace = true

tracing.workspace = true

anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
gethostname = "1"
axum.workspace = true
tokio-tungstenite = { version = "0.30.0", features = ["connect", "handshake", "stream", "rustls-tls-native-roots"] }
tokio_kcp = "0.9.8"
quinn = "0.11.12"
rcgen = { version = "0.14.10", features = ["pem"] }
rustls = { version = "0.23.45", features = ["ring"] }
boringtun = "0.7.1"
igd = { version = "0.12.1", features = ["aio"] }
tokio-rustls = "0.26.6"
rustls-pemfile = "2.2.0"
natpmp = "0.5.0"
base64 = "0.23.1"

[dev-dependencies]
tokio.workspace = true
bytes.workspace = true
rand.workspace = true
x25519-dalek.workspace = true
boringtun = "0.7.1"
serde_json.workspace = true
